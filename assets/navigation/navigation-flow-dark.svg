<svg xmlns="http://www.w3.org/2000/svg" width="720" height="20" viewBox="0 0 720 20">
  <style>
    .flow { animation: sweep 5.6s linear infinite; }
    .caps { animation: breathe 4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-180px); } to { transform: translateX(740px); } }
    @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; transform: translateX(278px); }
      .caps { animation: none; opacity: .65; }
    }
  </style>
  <defs>
    <linearGradient id="rail"><stop stop-color="#58c6e5" stop-opacity="0"/><stop offset=".18" stop-color="#58c6e5" stop-opacity=".35"/><stop offset=".82" stop-color="#58c6e5" stop-opacity=".35"/><stop offset="1" stop-color="#58c6e5" stop-opacity="0"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#60a5fa" stop-opacity="0"/><stop offset=".4" stop-color="#60a5fa" stop-opacity=".45"/><stop offset=".76" stop-color="#67e8e6"/><stop offset="1" stop-color="#67e8e6" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="bounds"><rect x="7" y="0" width="706" height="20" rx="10"/></clipPath>
  </defs>
  <path d="M18 10H702" stroke="url(#rail)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
  <g clip-path="url(#bounds)"><g class="flow"><rect y="9" width="164" height="2" rx="1" fill="url(#beam)" filter="url(#glow)" opacity=".8"/><rect y="9.2" width="164" height="1.6" rx=".8" fill="url(#beam)"/></g></g>
  <path class="caps" d="M18 5H8v10h10M702 5h10v10h-10" fill="none" stroke="#67e8e6" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
</svg>
